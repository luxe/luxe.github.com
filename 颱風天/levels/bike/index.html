<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d7e3e1">
  <title>Wanwan - Delivery bike</title>
  <script src="../../audio.js"></script>
  <script src="../../lifecycle.js"></script>
  <link rel="stylesheet" href="./style.css">
  <script src="./level.js" defer></script>
</head>
<body>
  <div class="rain" aria-hidden="true"></div>
  <main class="scene" aria-label="雨中的外送單車">
    <svg class="street" viewBox="0 0 600 820" fill="none">
      <defs>
        <linearGradient id="road" x2=".25" y2="1">
          <stop stop-color="#8fa6a0"/><stop offset="1" stop-color="#768f89"/>
        </linearGradient>
        <linearGradient id="glass" x2=".4" y2="1">
          <stop stop-color="#dcecea"/><stop offset="1" stop-color="#9fbdbb"/>
        </linearGradient>
        <clipPath id="screen-clip"><rect x="515" y="66" width="66" height="66" rx="7"/></clipPath>
      </defs>
      <g aria-hidden="true">
        <path d="M0 0H600V230H0Z" fill="#d7e3e1"/>
        <path d="M18 230V96Q18 84 30 84H128Q140 84 140 96V230Z" fill="#c4d3cd"/>
        <path d="M150 230V58Q150 46 162 46H272Q284 46 284 58V230Z" fill="#bccbc4"/>
        <path d="M294 230V112Q294 100 306 100H440Q452 100 452 112V230Z" fill="#c8d5cf"/>
        <g fill="#f1e2b4" opacity=".75">
          <rect x="40" y="110" width="26" height="22" rx="4"/><rect x="88" y="110" width="26" height="22" rx="4"/>
          <rect x="40" y="152" width="26" height="22" rx="4"/><rect x="174" y="72" width="28" height="24" rx="4"/>
          <rect x="230" y="72" width="28" height="24" rx="4"/><rect x="230" y="118" width="28" height="24" rx="4"/>
          <rect x="174" y="164" width="28" height="24" rx="4"/><rect x="320" y="128" width="28" height="22" rx="4"/>
          <rect x="396" y="128" width="28" height="22" rx="4"/><rect x="358" y="172" width="28" height="22" rx="4"/>
        </g>
        <path d="M10 196H148L136 214H22Z" fill="#9fb9a9"/>
        <path d="M296 202H450L440 218H306Z" fill="#d7a596"/>
        <rect y="226" width="600" height="68" fill="#c9d3c4"/>
        <path d="M0 252H600" stroke="#b5c1b2" stroke-width="2" stroke-dasharray="44 4"/>
        <rect y="288" width="600" height="10" fill="#e3e5d2"/>
        <rect y="298" width="600" height="464" fill="url(#road)"/>
        <path d="M0 422H600M0 604H600" stroke="#ece4bd" stroke-width="5" stroke-dasharray="34 30" opacity=".65"/>
        <g fill="#e9eddf" opacity=".82">
          <rect x="556" y="312" width="40" height="22" rx="3"/><rect x="556" y="358" width="40" height="22" rx="3"/>
          <rect x="556" y="404" width="40" height="22" rx="3"/><rect x="556" y="450" width="40" height="22" rx="3"/>
          <rect x="556" y="496" width="40" height="22" rx="3"/><rect x="556" y="542" width="40" height="22" rx="3"/>
          <rect x="556" y="588" width="40" height="22" rx="3"/><rect x="556" y="634" width="40" height="22" rx="3"/>
          <rect x="556" y="680" width="40" height="22" rx="3"/><rect x="556" y="726" width="40" height="22" rx="3"/>
        </g>
        <rect y="760" width="600" height="10" fill="#e3e5d2"/>
        <rect y="770" width="600" height="50" fill="#c9d3c4"/>
        <ellipse cx="548" cy="282" rx="18" ry="5" fill="#6f8580" opacity=".35"/>
        <rect x="543" y="140" width="10" height="142" rx="4" fill="#5d6f6c"/>
        <rect x="539" y="270" width="18" height="12" rx="3" fill="#4d5d5a"/>
        <rect x="503" y="50" width="90" height="98" rx="12" fill="#3c4a48"/>
        <path d="M509 60Q548 40 587 60" stroke="#2d3836" stroke-width="7" stroke-linecap="round"/>
        <rect x="511" y="62" width="74" height="74" rx="9" fill="#151d1c"/>
      </g>
      <g class="signal" aria-hidden="true">
        <rect class="screen" x="515" y="66" width="66" height="66" rx="7" fill="#1d2725"/>
        <image class="walker" x="515" y="66" width="66" height="66" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen-clip)"/>
        <rect class="glow" x="511" y="62" width="74" height="74" rx="9" stroke="#71f0d8" stroke-width="3"/>
      </g>
      <g class="traffic"></g>
      <g class="effects" aria-hidden="true" pointer-events="none"></g>
    </svg>
    <p id="instructions" class="sr-only">拖著外送單車從左邊騎到右邊的斑馬線，不要碰到汽車。碰到汽車就要重新開始。鍵盤可用方向鍵移動，按住 Shift 可移動更遠。</p>
    <p id="status" class="sr-only" role="status"></p>
  </main>
</body>
</html>
