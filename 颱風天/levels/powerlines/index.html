<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cfdcdc">
  <title>Wanwan - Power lines</title>
  <script src="../../audio.js"></script>
  <script src="../../lifecycle.js"></script>
  <link rel="stylesheet" href="./style.css">
  <script src="./level.js" defer></script>
</head>
<body>
  <div class="rain" aria-hidden="true"></div>
  <main class="scene" aria-label="雨中修電線">
    <svg class="street" viewBox="0 0 600 820" fill="none">
      <defs>
        <linearGradient id="sky" x2="0" y2="1">
          <stop stop-color="#bccbcc"/><stop offset="1" stop-color="#d5e0de"/>
        </linearGradient>
        <linearGradient id="road" x2=".25" y2="1">
          <stop stop-color="#8fa6a0"/><stop offset="1" stop-color="#768f89"/>
        </linearGradient>
        <linearGradient id="wood" x2="1">
          <stop stop-color="#7a5a40"/><stop offset=".45" stop-color="#9a7556"/><stop offset="1" stop-color="#6c4f38"/>
        </linearGradient>
        <linearGradient id="raincoat" x2=".3" y2="1">
          <stop stop-color="#f29a3a"/><stop offset="1" stop-color="#d9772a"/>
        </linearGradient>
        <radialGradient id="lamp-glow">
          <stop stop-color="#fff2b8" stop-opacity=".9"/><stop offset="1" stop-color="#fff2b8" stop-opacity="0"/>
        </radialGradient>
        <g id="insulator">
          <rect x="-3" y="-4" width="6" height="8" fill="#5b5f5c"/>
          <path d="M-9 -4H9L7 -9H-7Z" fill="#7fae9f"/>
          <path d="M-7 -10H7L5 -15H-5Z" fill="#8fbfb0"/>
          <rect x="-4" y="-19" width="8" height="5" rx="2" fill="#a6d1c3"/>
          <path d="M-6 -6H-2" stroke="#d8efe6" stroke-width="1.5" stroke-linecap="round"/>
        </g>
      </defs>

      <g aria-hidden="true">
        <rect x="-2000" y="-1000" width="4600" height="1600" fill="url(#sky)"/>
        <!-- Neighbourhood with the power out: windows dark until the lines are fixed. -->
        <path d="M-20 560V380Q-20 368 -8 368H96Q108 368 108 380V560Z" fill="#b2c2bf"/>
        <path d="M120 560V330Q120 318 132 318H238Q250 318 250 330V560Z" fill="#a8b9b6"/>
        <path d="M352 560V350Q352 338 364 338H470Q482 338 482 350V560Z" fill="#aebfbb"/>
        <path d="M492 560V396Q492 384 504 384H620V560Z" fill="#b6c5c1"/>
        <g class="windows">
          <rect x="10" y="398" width="26" height="22" rx="4"/><rect x="58" y="398" width="26" height="22" rx="4"/>
          <rect x="10" y="446" width="26" height="22" rx="4"/><rect x="58" y="494" width="26" height="22" rx="4"/>
          <rect x="146" y="346" width="28" height="24" rx="4"/><rect x="198" y="346" width="28" height="24" rx="4"/>
          <rect x="146" y="398" width="28" height="24" rx="4"/><rect x="198" y="450" width="28" height="24" rx="4"/>
          <rect x="146" y="502" width="28" height="24" rx="4"/>
          <rect x="378" y="366" width="28" height="22" rx="4"/><rect x="430" y="366" width="28" height="22" rx="4"/>
          <rect x="430" y="414" width="28" height="22" rx="4"/><rect x="378" y="462" width="28" height="22" rx="4"/>
          <rect x="430" y="510" width="28" height="22" rx="4"/>
          <rect x="516" y="410" width="26" height="22" rx="4"/><rect x="562" y="458" width="26" height="22" rx="4"/>
        </g>
        <path d="M128 524H244L234 540H138Z" fill="#9fb9a9"/>
        <path d="M358 534H476L466 550H368Z" fill="#d7a596"/>
        <!-- Sidewalk and wet road -->
        <rect x="-2000" y="556" width="4600" height="40" fill="#c9d3c4"/>
        <path d="M-2000 576H2600" stroke="#b5c1b2" stroke-width="2" stroke-dasharray="44 4"/>
        <rect x="-2000" y="592" width="4600" height="10" fill="#e3e5d2"/>
        <rect x="-2000" y="602" width="4600" height="1300" fill="url(#road)"/>
        <path d="M-2000 712H2600" stroke="#ece4bd" stroke-width="5" stroke-dasharray="34 30" opacity=".65"/>
        <ellipse cx="160" cy="660" rx="70" ry="9" fill="#c7dcd7" opacity=".45"/>
        <ellipse cx="470" cy="760" rx="62" ry="8" fill="#c7dcd7" opacity=".4"/>
        <!-- Two orange cones around the work site -->
        <g transform="translate(64 640)">
          <ellipse cy="2" rx="22" ry="5" fill="#5f7a74" opacity=".3"/>
          <path d="M-20 0H20L16 -6H-16Z" fill="#c76b3c"/>
          <path d="M-12 -6L-3 -46H3L12 -6Z" fill="#e8874a"/>
          <path d="M-9 -18H9L7 -28H-7Z" fill="#fff4dc"/>
        </g>
        <g transform="translate(552 646)">
          <ellipse cy="2" rx="22" ry="5" fill="#5f7a74" opacity=".3"/>
          <path d="M-20 0H20L16 -6H-16Z" fill="#c76b3c"/>
          <path d="M-12 -6L-3 -46H3L12 -6Z" fill="#e8874a"/>
          <path d="M-9 -18H9L7 -28H-7Z" fill="#fff4dc"/>
        </g>
      </g>

      <!-- Telephone poles -->
      <g class="poles" aria-hidden="true">
        <g class="pole" transform="translate(100 0)">
          <ellipse cy="598" rx="22" ry="5" fill="#5f7a74" opacity=".35"/>
          <rect x="-11" y="150" width="22" height="448" rx="4" fill="url(#wood)"/>
          <path d="M-4 170V590M5 230V560" stroke="#5e4330" stroke-width="1.5" opacity=".35"/>
          <rect x="-74" y="194" width="148" height="12" rx="3" fill="#8a6649"/>
          <rect x="-74" y="284" width="148" height="12" rx="3" fill="#8a6649"/>
          <path d="M-46 206L-6 246M46 206L6 246M-46 296L-6 336M46 296L6 336" stroke="#6f7471" stroke-width="4" stroke-linecap="round"/>
          <rect x="-16" y="360" width="32" height="44" rx="5" fill="#8b9692"/>
          <rect x="-12" y="364" width="24" height="10" rx="2" fill="#a5afab"/>
        </g>
        <g class="pole" transform="translate(500 0)">
          <ellipse cy="598" rx="22" ry="5" fill="#5f7a74" opacity=".35"/>
          <rect x="-11" y="150" width="22" height="448" rx="4" fill="url(#wood)"/>
          <path d="M-4 170V590M5 230V560" stroke="#5e4330" stroke-width="1.5" opacity=".35"/>
          <rect x="-74" y="194" width="148" height="12" rx="3" fill="#8a6649"/>
          <rect x="-74" y="284" width="148" height="12" rx="3" fill="#8a6649"/>
          <path d="M-46 206L-6 246M46 206L6 246M-46 296L-6 336M46 296L6 336" stroke="#6f7471" stroke-width="4" stroke-linecap="round"/>
          <!-- Street lamp that comes back on once the power is restored -->
          <path d="M-8 330Q-50 318 -64 340" stroke="#5d6a67" stroke-width="6" stroke-linecap="round"/>
          <ellipse class="lamp-glow" cx="-64" cy="370" rx="60" ry="46" fill="url(#lamp-glow)"/>
          <path d="M-80 340H-48L-54 352H-74Z" fill="#4e5a57"/>
          <ellipse class="lamp" cx="-64" cy="353" rx="9" ry="3.5" fill="#7d8885"/>
        </g>
      </g>
      <g class="wires" pointer-events="none"></g>
      <g class="insulators" aria-hidden="true" pointer-events="none"></g>
      <g class="ends"></g>
      <g class="sparks" aria-hidden="true" pointer-events="none"></g>

      <!-- Construction worker seen from behind, looking up at the lines -->
      <g class="worker" aria-hidden="true" pointer-events="none">
        <g class="cheer-arm">
          <path d="M404 760Q440 720 452 662" stroke="url(#raincoat)" stroke-width="40" stroke-linecap="round"/>
          <path d="M418 748L444 694" stroke="#eef3c8" stroke-width="6" stroke-linecap="round" opacity=".9"/>
          <circle cx="454" cy="642" r="18" fill="#e7b48d"/>
          <path d="M444 630Q454 618 464 630" stroke="#c98f68" stroke-width="3" stroke-linecap="round"/>
        </g>
        <!-- Raincoat body runs past the bottom so he stands in the foreground on tall screens. -->
        <path d="M164 1300V842C166 776 206 736 254 724H346C394 736 434 776 436 842V1300Z" fill="url(#raincoat)"/>
        <path d="M212 1300L228 760M388 1300L372 760" stroke="#b9621f" stroke-width="3" opacity=".45"/>
        <path d="M300 760V1300" stroke="#c46a24" stroke-width="2" opacity=".5"/>
        <!-- Reflective stripes across the back -->
        <path d="M168 846H432M166 930H434" stroke="#eef3c8" stroke-width="14"/>
        <path d="M168 846H432M166 930H434" stroke="#c9d17d" stroke-width="2" stroke-dasharray="6 10"/>
        <path d="M262 726V1300M338 726V1300" stroke="#eef3c8" stroke-width="12" opacity=".95"/>
        <!-- Hood bunched at the neck, back of the head, hard hat -->
        <path d="M246 732Q300 758 354 732Q346 712 300 710Q254 712 246 732Z" fill="#c76d26"/>
        <ellipse cx="300" cy="698" rx="36" ry="30" fill="#3d3330"/>
        <path d="M266 712Q300 728 334 712" stroke="#e1aa82" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="262" cy="700" rx="6" ry="10" fill="#e1aa82"/>
        <ellipse cx="338" cy="700" rx="6" ry="10" fill="#e1aa82"/>
        <path d="M250 686Q252 634 300 630Q348 634 350 686Z" fill="#f4cf3b"/>
        <path d="M300 630V686" stroke="#e0b52a" stroke-width="8"/>
        <path d="M236 686Q300 674 364 686Q366 694 362 697Q300 686 238 697Q234 694 236 686Z" fill="#e5b72e"/>
        <path d="M268 648Q279 639 292 636" stroke="#fff4b0" stroke-width="5" stroke-linecap="round" opacity=".8"/>
        <!-- Rain beading on the hat and shoulders -->
        <g fill="#ffffff" opacity=".6"><circle cx="326" cy="652" r="2.5"/><circle cx="214" cy="790" r="2"/><circle cx="398" cy="808" r="2.5"/><circle cx="246" cy="884" r="2"/></g>
      </g>

      <g class="sparkles" aria-hidden="true" pointer-events="none"></g>
    </svg>
    <p id="instructions" class="sr-only">把兩條斷掉的電線拉回電線桿上對應的礙子。拖曳電線斷頭到發亮的礙子附近放開即可接上。鍵盤：選取斷頭後按 Enter 接上。</p>
    <p id="status" class="sr-only" role="status"></p>
  </main>
</body>
</html>
