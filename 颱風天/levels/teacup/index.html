<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8e0d3">
  <title>Wanwan - A cup of calm</title>
  <script src="../../audio.js"></script>
  <script src="../../lifecycle.js"></script>
  <link rel="stylesheet" href="./style.css">
  <script src="./level.js" defer></script>
</head>
<body>
  <main class="scene" aria-label="喝杯熱茶">

        <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#d7b88e"/><stop offset="1" stop-color="#bd986f"/></linearGradient>
        <linearGradient id="ceramic" x2=".8" y2="1"><stop stop-color="#c3d6ca"/><stop offset="1" stop-color="#88ac9e"/></linearGradient>
        <clipPath id="tea-clip"><ellipse cx="407" cy="474" rx="65" ry="25"/></clipPath>
      </defs>
      <ellipse cx="300" cy="650" rx="258" ry="39" fill="#897862" opacity=".12"/>
      <rect x="32" y="381" width="536" height="252" rx="44" fill="#b38e65"/>
      <rect x="32" y="365" width="536" height="252" rx="44" fill="url(#wood)"/>
      <path d="M57 416H543M57 559H543M92 590H508" stroke="#ead0aa" stroke-width="2" opacity=".45"/>
      <rect x="66" y="405" width="468" height="178" rx="32" stroke="#a9855f" stroke-width="3"/>
      <path d="M87 531H513M87 542H513M87 553H513" stroke="#a9855f" stroke-width="3" opacity=".4"/>

      <g class="cup" role="button" tabindex="0" aria-label="喝茶" aria-disabled="true">
        <ellipse cx="407" cy="538" rx="84" ry="28" fill="#e2ded0"/>

        <ellipse cx="407" cy="474" rx="70" ry="30" fill="#edf0df" stroke="#82a494" stroke-width="3"/>
        <ellipse cx="407" cy="474" rx="63" ry="24" fill="#d0d6c0"/>
        <ellipse cx="407" cy="479" rx="48" ry="14" fill="#bac7ac" opacity=".5"/>
        <g clip-path="url(#tea-clip)">
          <ellipse class="tea-surface" cx="407" cy="474" rx="65" ry="25" fill="#a5713d"/>
          <ellipse class="tea-surface" cx="407" cy="468" rx="58" ry="20" fill="#c18c4d" opacity=".5"/>
          <g class="tea-storm" transform="translate(407 474) scale(.65 .27)">
            <g class="typhoon-spin">
              <path d="M-6-4C-14-37 16-60 47-48C65-41 72-24 68-9C51-31 24-35 6-17" fill="#ebc388"/>

            </g>
          </g>
        </g>
        <path d="M345 470Q407 439 469 470" stroke="#f5f0d9" stroke-width="2" opacity=".7"/>
        <g class="steam" stroke="#fff9eb" stroke-width="5" stroke-linecap="round">
          <path d="M385 433C365 412 401 396 385 374"/>
          <path d="M410 425C390 404 426 388 410 366"/>
          <path d="M434 434C414 413 450 397 434 375"/>
        </g>
        <ellipse class="hit" cx="407" cy="490" rx="86" ry="62" fill="transparent"/>
      </g>
      <path class="stream" d="M376 345Q380 410 393 472" stroke="#bb8547" stroke-width="8" stroke-linecap="round"/>
      <g class="pot-position">
        <g class="pot" role="button" tabindex="0" aria-label="提起茶壺倒茶">
          <path d="M141 424C72 380 81 494 145 479" stroke="#70988a" stroke-width="19"/>
          <path d="M140 425C91 399 98 478 143 473" stroke="#b9cfc0" stroke-width="8"/>
          <path d="M244 440Q275 443 294 408L312 413Q300 484 255 485" fill="url(#ceramic)" stroke="#82a494" stroke-width="3" stroke-linejoin="round"/>
          <path d="M134 433C125 459 126 504 165 517Q198 528 236 511C267 496 270 459 252 432Z" fill="url(#ceramic)"/>
          <ellipse cx="193" cy="433" rx="59" ry="16" fill="#729a89"/>
          <path d="M137 432Q151 406 193 407Q234 406 250 432Z" fill="#b6cdbb"/>
          <ellipse cx="193" cy="409" rx="12" ry="8" fill="#739b89"/>

          <path d="M181 470Q192 457 206 470Q197 487 181 470Z" stroke="#6f9681" stroke-width="2"/>

        </g>
      </g>
      <g aria-hidden="true">
        <path d="M96 351Q139 328 165 351Q128 371 96 351" fill="#9eaf86"/>
        <path d="M125 350Q142 318 167 326Q153 351 125 350" fill="#819a77"/>
        <path d="M100 353L166 334" stroke="#6d8b68" stroke-width="2"/>
      </g>
    </svg>
    <p class="sr-only">提起茶壺倒茶，裝滿後點茶杯喝茶。也可以點茶壺或按 Enter 倒茶。</p>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
